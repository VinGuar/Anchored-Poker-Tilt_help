<svg width="400" height="480" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
<title>Anchored — dark background variant</title>
<defs>
  <linearGradient id="tealDark" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#42dbc8"/>
    <stop offset="100%" stop-color="#14b8a6"/>
  </linearGradient>
  <linearGradient id="blueDark" x1="100%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#9db2d2"/>
    <stop offset="100%" stop-color="#99a4ff"/>
  </linearGradient>
  <clipPath id="spadeClipD">
    <path d="M200,30 C200,30 80,98 62,178 C50,236 78,280 124,282 C103,306 89,325 74,342 L93,342 C102,325 127,310 200,308 C273,310 298,325 307,342 L326,342 C311,325 297,306 276,282 C322,280 350,236 338,178 C320,98 200,30 200,30 Z"/>
  </clipPath>
</defs>

<!-- transparent background — no rect fill -->

<!-- Spade filled with split gradient, clipped -->
<g clip-path="url(#spadeClipD)">
  <rect x="0" y="0" width="200" height="480" fill="url(#tealDark)"/>
  <!-- left brain fold lines -->
  <path d="M145,65 C122,82 105,110 100,140 C96,170 106,200 126,218" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.2"/>
  <path d="M170,50 C144,70 125,102 120,135 C115,168 126,200 148,220" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.15"/>
  <path d="M122,95 C104,112 96,136 100,160" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.15"/>

  <rect x="200" y="0" width="200" height="480" fill="url(#blueDark)"/>
  <!-- right brain fold lines -->
  <path d="M255,65 C278,82 295,110 300,140 C304,170 294,200 274,218" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.2"/>
  <path d="M230,50 C256,70 275,102 280,135 C285,168 274,200 252,220" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.15"/>
  <path d="M278,95 C296,112 304,136 300,160" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.15"/>

  <!-- center seam -->
  <rect x="198.5" y="0" width="3" height="480" fill="#000000" opacity="0.35"/>
</g>

<!-- Spade outline -->
<path d="M200,30 C200,30 80,98 62,178 C50,236 78,280 124,282 C103,306 89,325 74,342 L93,342 C102,325 127,310 200,308 C273,310 298,325 307,342 L326,342 C311,325 297,306 276,282 C322,280 350,236 338,178 C320,98 200,30 200,30 Z" fill="none" stroke="#2c3f5d" stroke-width="1.5"/>

<!-- Wordmark -->
<text x="200" y="398" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="9" fill="#e8efff">ANCHORED</text>
<!-- Tagline -->
<text x="200" y="424" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="3.5" fill="#42dbc8" opacity="0.85">STAY GROUNDED. PLAY YOUR BEST.</text>
</svg>
